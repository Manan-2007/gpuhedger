# Builds the frontend for Monad Testnet and publishes it to GitHub Pages on every push to main.
# Requires: Settings → Pages → Source = "GitHub Actions", and contracts deployed to Monad Testnet
# (frontend/src/contracts/deployments/10143.json committed). GitHub Pages on private repos needs a paid plan.
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_CHAIN_ID: "10143"
          VITE_MONAD_RPC_URL: https://testnet-rpc.monad.xyz
          VITE_EXPLORER_URL: https://testnet.monadexplorer.com
      # SPA fallback: serve the app for deep links like /markets/3
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
